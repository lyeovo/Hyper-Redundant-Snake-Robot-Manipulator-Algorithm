[permissions]
allow = ["Bash=diff runLArmIK_2D_Simple.m simple/runLArmIK_2D_Simple.m | head -30; echo \"---diff exit: $?\"", "Bash=python - <<'EOF'\nimport io\nfor f in ['runLArmIK_2D.m','runLArmIK_2D_Simple.m','GlobalParams.m','README.md','simple/runLArmIK_2D_Simple.m']:\n    raw = open(f,'rb').read()\n    # try decode\n    for enc in ['utf-8','gbk']:\n        try:\n            raw.decode(enc)\n            status = f'{enc} OK'\n        except UnicodeDecodeError:\n            status = f'{enc} FAIL'\n        print(f'{f}: {status}')\n    print()\nEOF", "Bash=python - <<'EOF'\n# 检查 runLArmIK_2D.m 中是否存在混用编码：统计每行能否按 utf-8 解码\nraw = open('runLArmIK_2D.m','rb').read().split(b'\\n')\nutf8_bad = 0; total_nonascii = 0\nbad_lines = []\nfor i,line in enumerate(raw,1):\n    try:\n        line.decode('utf-8')\n    except UnicodeDecodeError:\n        utf8_bad += 1\n        if len(bad_lines)<15: bad_lines.append(i)\n    if any(b>127 for b in line): total_nonascii += 1\nprint(f'runLArmIK_2D.m: 含非ASCII行={total_nonascii}, 其中UTF-8解码失败行={utf8_bad}')\nprint('失败行号示例:', bad_lines)\nEOF"]
